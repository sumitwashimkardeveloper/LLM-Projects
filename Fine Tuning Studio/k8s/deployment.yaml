apiVersion: apps/v1
kind: Deployment
metadata:
  name: finetuning-studio-backend
  namespace: finetuning
spec:
  replicas: 3
  selector:
    matchLabels:
      app: finetuning-studio-backend
  template:
    metadata:
      labels:
        app: finetuning-studio-backend
    spec:
      containers:
      - name: backend
        image: finetuning-studio:backend-latest
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: finetuning-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: finetuning-secrets
              key: redis-url
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: finetuning-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ping
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: finetuning-studio-backend
  namespace: finetuning
spec:
  selector:
    app: finetuning-studio-backend
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finetuning-studio-hpa
  namespace: finetuning
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finetuning-studio-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: finetuning-studio-pdb
  namespace: finetuning
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: finetuning-studio-backend
